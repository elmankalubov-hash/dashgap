<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DASH GAPI: меню и заказ онлайн</title>
<style>
:root{--bg:#f6ecd9;--card:#fffaf0;--ink:#2a1f14;--mute:#7a6a58;--line:#e8d9bd;--accent:#d93a2b;--accent-ink:#fff;--green:#1f6f4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root[data-theme="dark"]{--bg:#131a16;--card:#1c2621;--ink:#eef2ec;--mute:#9aa8a0;--line:#2b3832;--accent:#ee5a4a;--accent-ink:#1a0805;--green:#5cc592}}
:root[data-theme="dark"]{--bg:#131a16;--card:#1c2621;--ink:#eef2ec;--mute:#9aa8a0;--line:#2b3832;--accent:#ee5a4a;--accent-ink:#1a0805;--green:#5cc592}
*{box-sizing:border-box}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
header{padding:28px 18px 8px;max-width:640px;margin:0 auto}
h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
header p{margin:8px 0 0;color:var(--mute)}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line);margin-top:14px}
nav div{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;max-width:640px;margin:0 auto;scrollbar-width:none}
nav a{flex:none;padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
main{max-width:640px;margin:0 auto;padding:0 18px}
h2{font-size:22px;margin:26px 0 10px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;align-items:center}
.ico{font-size:34px;width:56px;height:56px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.info{flex:1;min-width:0}
.info b{display:block;font-size:16px}
.info small{display:block;color:var(--mute);font-size:13.5px;margin:2px 0 6px}
.price{font-weight:800}
.price span{color:var(--mute);font-weight:400;font-size:13px;margin-left:6px}
.qty{display:flex;align-items:center;gap:4px;flex:none}
button{font:inherit;cursor:pointer}
.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;line-height:1}
.qty .add{width:auto;padding:0 16px;background:var(--accent);color:var(--accent-ink);border:0;font-size:15px;font-weight:700}
.qty output{min-width:24px;text-align:center;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:2px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));z-index:10;display:none}
#bar button{display:flex;justify-content:space-between;width:100%;max-width:604px;margin:0 auto;padding:16px 20px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
#panel h3{margin:0 0 10px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
#close{border:0;background:none;color:var(--mute);font-size:28px;line-height:1;width:44px;height:44px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.total{font-weight:800;font-size:18px;border:0;padding:12px 0}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.err{color:var(--accent);font-size:14px;margin-top:10px;min-height:20px}
#send{width:100%;margin-top:6px;padding:16px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:800;font-size:17px}
#send{color:#fff}
#wa{width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:none;color:var(--mute);font-weight:600}
#toast{position:fixed;left:16px;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:30;max-width:560px;margin:0 auto;padding:16px;border-radius:14px;background:var(--green);color:#fff;font-weight:700;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.note{color:var(--mute);font-size:13px;margin:10px 0 0;text-align:center}
</style>
</head>
<body>
<header>
<h1>DASH GAPI</h1>
<p>Кухня-бар, десерты и полуфабрикаты. Выберите блюда и отправьте заказ нам в WhatsApp.</p>
<p>Дербент, ул. Гагарина, 2б, рядом с GREEN PARK</p>
</header>
<nav><div id="tabs"></div></nav>
<main id="menu"></main>
<div id="bar"><button id="open"><span id="barCount"></span><span id="barSum"></span></button></div>
<div id="sheet"><div id="panel" role="dialog" aria-modal="true" aria-label="Корзина">
<h3>Ваш заказ <button id="close" aria-label="Закрыть">×</button></h3>
<div id="lines"></div>
<label for="name">Имя</label><input id="name" autocomplete="name">
<label for="phone">Телефон</label><input id="phone" type="tel" autocomplete="tel" placeholder="+7">
<label for="addr">Адрес доставки</label><input id="addr" autocomplete="street-address" placeholder="Улица, дом, квартира">
<label for="pay">Оплата</label><select id="pay"><option>Наличными курьеру</option><option>Картой курьеру</option><option>Переводом</option></select>
<label for="note">Комментарий</label><textarea id="note" rows="2" placeholder="Например: без лука, позвонить у двери"></textarea>
<div class="err" id="err" role="alert"></div>
<button id="send">Заказать</button>
<button id="wa" type="button">Или отправить в WhatsApp</button>
<p class="note">Заказ придёт к нам сразу, мы перезвоним для подтверждения.</p>
</div></div>
<script>
// === НАСТРОЙКИ: меняйте здесь ===
var PHONE = "79226390002"; // номер WhatsApp без плюса и пробелов
var ORDER_URL = "https://script.google.com/macros/s/AKfycbyvomg_Y-xf42hIqddxrPk7eR05akaIPg-p11Trol3_9A0CPqJxVSyJnujUxC0fXTTj/exec"; // адрес «почтальона» (заказ уходит в Telegram)
var MENU = [
 {cat:"Холодные роллы", items:[
  {n:"Филадельфия", d:"Лосось, сливочный сыр, огурец", w:"8 шт", p:490, i:"🍣"},
  {n:"Калифорния", d:"Краб, авокадо, огурец, икра масаго", w:"8 шт", p:420, i:"🍣"}]},
 {cat:"Жареные роллы", items:[
  {n:"Темпура с креветкой", d:"Креветка, сыр, жарится во фритюре", w:"8 шт", p:520, i:"🍤"},
  {n:"Жареный с курицей", d:"Курица, сыр, огурец", w:"8 шт", p:450, i:"🍤"}]},
 {cat:"Запечённые роллы", items:[
  {n:"Запечённый с лососем", d:"Лосось, сыр, соус терияки", w:"8 шт", p:540, i:"🍱"},
  {n:"Запечённый с курицей", d:"Курица, сыр, грибы", w:"8 шт", p:450, i:"🍱"}]},
 {cat:"Салаты", items:[
  {n:"Цезарь с курицей", d:"Курица, салат, пармезан, сухарики", w:"250 г", p:380, i:"🥗"},
  {n:"Греческий", d:"Овощи, фета, маслины", w:"250 г", p:340, i:"🥗"}]},
 {cat:"Пицца", items:[
  {n:"Маргарита", d:"Томатный соус, моцарелла, базилик", w:"30 см", p:480, i:"🍕"},
  {n:"Пепперони", d:"Пепперони, моцарелла, томатный соус", w:"30 см", p:560, i:"🍕"}]},
 {cat:"П.П. линейка", items:[
  {n:"Курица с овощами", d:"Грудка на гриле, овощи, без масла", w:"300 г", p:390, i:"🥙"},
  {n:"Боул с лососем", d:"Рис, лосось, авокадо, огурец", w:"350 г", p:520, i:"🥙"}]},
 {cat:"Пасты", items:[
  {n:"Карбонара", d:"Бекон, сливки, пармезан", w:"320 г", p:430, i:"🍝"},
  {n:"Болоньезе", d:"Говяжий фарш, томатный соус", w:"320 г", p:410, i:"🍝"}]},
 {cat:"Супы", items:[
  {n:"Куриный суп с лапшой", d:"Домашний бульон", w:"350 мл", p:250, i:"🍲"},
  {n:"Борщ", d:"Со сметаной", w:"350 мл", p:280, i:"🍲"}]}
];
// === конец настроек ===
var cart = {}, all = [], $ = function(id){return document.getElementById(id)};
function rub(n){return n.toLocaleString("ru-RU")+" ₽"}
var tabs = $("tabs"), menu = $("menu");
MENU.forEach(function(c, ci){
  var a = document.createElement("a"); a.href = "#c"+ci; a.textContent = c.cat; tabs.appendChild(a);
  var h = document.createElement("h2"); h.id = "c"+ci; h.textContent = c.cat; menu.appendChild(h);
  c.items.forEach(function(it){
    it.id = all.length; all.push(it);
    var el = document.createElement("div"); el.className = "item";
    el.innerHTML = '<div class="ico"></div><div class="info"><b></b><small></small><div class="price"></div></div><div class="qty" id="q'+it.id+'"></div>';
    el.querySelector(".ico").textContent = it.i;
    el.querySelector("b").textContent = it.n;
    el.querySelector("small").textContent = it.d;
    el.querySelector(".price").innerHTML = rub(it.p)+'<span></span>';
    el.querySelector(".price span").textContent = it.w;
    menu.appendChild(el);
  });
});
function qtyBox(id){
  var box = $("q"+id), n = cart[id] || 0; box.innerHTML = "";
  function mk(t, cls, fn, label){var b = document.createElement("button"); b.textContent = t; if(cls) b.className = cls; b.setAttribute("aria-label", label); b.onclick = fn; return b}
  if(!n){ box.appendChild(mk("В корзину","add",function(){change(id,1)},"Добавить "+all[id].n)); return }
  var o = document.createElement("output"); o.textContent = n;
  box.appendChild(mk("−","",function(){change(id,-1)},"Убрать одну порцию "+all[id].n));
  box.appendChild(o);
  box.appendChild(mk("+","",function(){change(id,1)},"Добавить ещё "+all[id].n));
}
function totals(){var c=0,s=0; for(var k in cart){c+=cart[k]; s+=cart[k]*all[k].p} return {c:c,s:s}}
function change(id, d){
  cart[id] = (cart[id]||0)+d; if(cart[id] <= 0) delete cart[id];
  qtyBox(id); refresh();
}
function refresh(){
  var t = totals();
  $("bar").style.display = t.c ? "block" : "none";
  $("barCount").textContent = "Корзина · " + t.c + " шт";
  $("barSum").textContent = rub(t.s);
  var box = $("lines"); box.innerHTML = "";
  Object.keys(cart).forEach(function(k){
    var r = document.createElement("div"); r.className = "row";
    var a = document.createElement("span"), b = document.createElement("span");
    a.textContent = all[k].n + " × " + cart[k]; b.textContent = rub(all[k].p*cart[k]);
    r.appendChild(a); r.appendChild(b); box.appendChild(r);
  });
  var tr = document.createElement("div"); tr.className = "row total";
  tr.innerHTML = "<span>Итого</span><span></span>"; tr.lastChild.textContent = rub(t.s); box.appendChild(tr);
  if(!t.c) $("sheet").style.display = "none";
}
all.forEach(function(it){qtyBox(it.id)});
$("open").onclick = function(){$("sheet").style.display = "block"};
$("close").onclick = function(){$("sheet").style.display = "none"};
$("sheet").onclick = function(e){if(e.target === $("sheet")) $("sheet").style.display = "none"};
function build(){
  var name = $("name").value.trim(), phone = $("phone").value.trim(), addr = $("addr").value.trim();
  if(!name || !phone || !addr){ $("err").textContent = "Заполните имя, телефон и адрес доставки."; return null }
  $("err").textContent = "";
  var t = totals(), lines = ["Новый заказ с сайта:", ""];
  Object.keys(cart).forEach(function(k){ lines.push("• " + all[k].n + " × " + cart[k] + " = " + rub(all[k].p*cart[k])) });
  lines.push("", "Итого: " + rub(t.s), "", "Имя: " + name, "Телефон: " + phone, "Адрес: " + addr, "Оплата: " + $("pay").value);
  var note = $("note").value.trim(); if(note) lines.push("Комментарий: " + note);
  return lines.join("\n");
}
function toast(msg){
  var d = document.createElement("div"); d.id = "toast"; d.setAttribute("role","status"); d.textContent = msg;
  document.body.appendChild(d); setTimeout(function(){d.remove()}, 9000);
}
$("send").onclick = async function(){
  var text = build(); if(!text) return;
  var b = $("send"); b.disabled = true; b.textContent = "Отправляем…";
  try{
    await fetch(ORDER_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({text:text})});
    cart = {}; all.forEach(function(it){qtyBox(it.id)}); refresh();
    toast("Заказ принят! Мы скоро свяжемся с вами для подтверждения.");
  }catch(e){
    $("err").textContent = "Не удалось отправить заказ. Попробуйте ещё раз или отправьте его через WhatsApp.";
  }
  b.disabled = false; b.textContent = "Заказать";
};
$("wa").onclick = function(){
  var text = build(); if(!text) return;
  var a = document.createElement("a");
  a.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
  a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
};
refresh();
</script>
</body>
</html>
